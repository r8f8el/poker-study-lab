# ==============================================================================
# Poker Study Lab — Optional Developer Infrastructure
# Note: Poker Study Lab runs 100% standalone out-of-the-box (in-memory / SQLite).
# This docker-compose stack is strictly OPTIONAL for developer persistence benchmarking
# and local session hand review.
# ==============================================================================
services:
  poker-db:
    image: postgres:16-alpine
    container_name: poker_study_lab_db
    environment:
      POSTGRES_USER: poker_user
      POSTGRES_PASSWORD: poker_dev_password
      POSTGRES_DB: poker_study_lab
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - poker_data:/var/lib/postgresql/data

volumes:
  poker_data:
