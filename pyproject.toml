[project]
name = "poker-study-lab"
version = "0.3.0"
description = "Deterministic Poker Study Lab Vision & State Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "opencv-python-headless>=4.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
